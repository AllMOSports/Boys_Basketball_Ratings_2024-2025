name: 2024-2025 Boys Basketball Ratings
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-ratings:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pandas

      - name: Network diagnostic
        run: |
          echo "=== DNS resolution ==="
          getent ahosts www.mshsaa.org || echo "DNS FAILED"

          echo ""
          echo "=== IPv4 test ==="
          curl -4 -v https://www.mshsaa.org/ --max-time 15 -o /dev/null -s -w "HTTP %{http_code}\n" || echo "IPv4 FAILED"

          echo ""
          echo "=== IPv6 test ==="
          curl -6 -v https://www.mshsaa.org/ --max-time 15 -o /dev/null -s -w "HTTP %{http_code}\n" || echo "IPv6 FAILED"

          echo ""
          echo "=== Scoreboard endpoint (IPv4) ==="
          curl -4 -v "https://www.mshsaa.org/activities/scoreboard.aspx?alg=5&date=11012024" --max-time 15 -o /dev/null -s -w "HTTP %{http_code}\n" || echo "SCOREBOARD IPv4 FAILED"

      - name: Run ratings script
        run: python Boys_Basketball_Ratings_2024-2025.py

      - name: Commit and push Boys_Basketball_Ratings_2024-2025.json
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git diff --staged --quiet || git commit -m "Update ratings $(date +'%Y-%m-%d')"
          git push
